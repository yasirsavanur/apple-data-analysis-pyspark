name: PySpark pipeline verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate reference results
        run: python scripts/validate_reference_results.py

      - name: Run Spark and Delta tests
        run: pytest -q

      - name: Run complete pipeline
        run: |
          apple-analysis all \
            --raw-dir data/raw \
            --work-dir build \
            --output-dir outputs

      - name: Upload pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: apple-analysis-output
          path: |
            outputs/manifest.json
            outputs/quality_report.json
